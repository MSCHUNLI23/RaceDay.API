name: .NET CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup.NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.sln
      - name: Build
        run: dotnet build RaceDay.API/RaceDay.API.sln --no-restore
      - name: Test
        run: dotnet test RaceDay.API/RaceDay.API.sln --no-build --verbosity normal
