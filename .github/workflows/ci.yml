name: .NET RaceDay CI/CD

on:
  push:
    branches: [ "master", "main", "Part3" ] # Triggers on pushes to these branches
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # CRITICAL: Must match your project's .NET 8.0 version

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test --no-build --verbosity normal --configuration Release

    
